name: Deploy Screeps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: screeps-ptr-runtime-mutation
  cancel-in-progress: false

env:
  SCREEPS_TARGET: ptr

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Set up Turborepo Remote Cache
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: team_nu4kVwu2CzXfF3XkFsdFJFCS

      - name: Validate Infisical configuration
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
        run: |
          test -n "$INFISICAL_IDENTITY_ID" || (echo "Missing repository variable INFISICAL_IDENTITY_ID" && exit 1)
          test -n "$INFISICAL_PROJECT_SLUG" || (echo "Missing repository variable INFISICAL_PROJECT_SLUG" && exit 1)
          test -n "$INFISICAL_ENV_SLUG" || (echo "Missing repository variable INFISICAL_ENV_SLUG" && exit 1)

      - name: Fetch Screeps deploy secret from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /deploy
          recursive: false
          include-imports: false

      - name: Install runtime workspace dependencies
        run: pnpm install --filter . --filter @screeps/runtime --frozen-lockfile

      - name: Check runtime
        run: |
          pnpm --filter @screeps/runtime lint
          pnpm --filter @screeps/runtime typecheck
          pnpm --filter @screeps/runtime test

      - name: Deploy Screeps runtime
        run: pnpm run deploy:screeps
        env:
          SCREEPS_BRANCH: ${{ vars.SCREEPS_BRANCH }}
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}

      - name: Verify deployed Screeps code
        run: pnpm run verify:screeps
        env:
          SCREEPS_BRANCH: ${{ vars.SCREEPS_BRANCH }}
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}

      - name: Request activation for verified PTR runtime
        if: env.SCREEPS_TARGET == 'ptr'
        run: node scripts/activate-ptr.mjs
        env:
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}
