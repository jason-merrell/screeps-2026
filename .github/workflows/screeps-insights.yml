name: Screeps Insights

on:
  workflow_dispatch:
    inputs:
      room:
        description: Optional room name to inspect, for example W1N1
        required: false
        type: string
      shard:
        description: Optional shard for the requested room, for example shard3
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  collect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 5 &&
       (startsWith(github.event.comment.body, '/collect') ||
        startsWith(github.event.comment.body, '/scan') ||
        startsWith(github.event.comment.body, '/recommend-start') ||
        startsWith(github.event.comment.body, '/place-start') ||
        startsWith(github.event.comment.body, '/deploy-code') ||
        startsWith(github.event.comment.body, '/experiment') ||
        startsWith(github.event.comment.body, '/scenario')) &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest

    concurrency:
      group: screeps-insights-${{ github.event_name == 'issue_comment' && github.event.comment.id || github.run_id }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Turborepo Remote Cache
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: team_nu4kVwu2CzXfF3XkFsdFJFCS

      - name: Validate atomic request
        id: request
        run: node scripts/parse-insights-request.mjs
        env:
          SCREEPS_REQUEST: ${{ github.event.comment.body }}
          SCREEPS_COMMENT_ID: ${{ github.event.comment.id }}
          SCREEPS_INPUT_ROOM: ${{ inputs.room }}
          SCREEPS_INPUT_SHARD: ${{ inputs.shard }}

      - name: Check idempotency receipt
        id: dedupe
        if: github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.request.outputs.marker }}
        run: |
          set -euo pipefail
          completed=false
          if gh api "repos/${GITHUB_REPOSITORY}/issues/5/comments" --paginate --jq '.[].body' | grep -Fq -- "$MARKER"; then
            completed=true
            echo "Request already completed; no operation will run."
          fi
          echo "completed=$completed" >> "$GITHUB_OUTPUT"

      - name: Validate Infisical configuration
        if: >-
          (github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.completed != 'true') &&
          steps.request.outputs.mode != 'scenario'
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
        run: |
          test -n "$INFISICAL_IDENTITY_ID" || (echo "Missing repository variable INFISICAL_IDENTITY_ID" && exit 1)
          test -n "$INFISICAL_PROJECT_SLUG" || (echo "Missing repository variable INFISICAL_PROJECT_SLUG" && exit 1)
          test -n "$INFISICAL_ENV_SLUG" || (echo "Missing repository variable INFISICAL_ENV_SLUG" && exit 1)

      - name: Fetch Screeps token from Infisical
        if: >-
          (github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.completed != 'true') &&
          steps.request.outputs.mode != 'scenario'
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /deploy
          recursive: false
          include-imports: false

      - name: Collect Screeps insights
        if: >-
          (github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.completed != 'true') &&
          steps.request.outputs.mode != 'place-start' &&
          steps.request.outputs.mode != 'deploy-code' &&
          steps.request.outputs.mode != 'experiment' &&
          steps.request.outputs.mode != 'scenario'
        run: node scripts/collect-insights.mjs
        env:
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}
          SCREEPS_SHARD: ${{ vars.SCREEPS_SHARD }}
          SCREEPS_MODE: ${{ steps.request.outputs.mode }}
          SCREEPS_TARGET: ${{ steps.request.outputs.target }}
          SCREEPS_ROOM: ${{ steps.request.outputs.room }}
          SCREEPS_SECTOR: ${{ steps.request.outputs.sector }}
          SCREEPS_REQUESTED_SHARD: ${{ steps.request.outputs.shard }}
          SCREEPS_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SCREEPS_COMMAND: ${{ steps.request.outputs.command }}

      - name: Place start
        if: >-
          (github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.completed != 'true') &&
          steps.request.outputs.mode == 'place-start'
        run: node scripts/place-start.mjs
        env:
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}
          SCREEPS_SHARD: ${{ vars.SCREEPS_SHARD }}
          SCREEPS_TARGET: ${{ steps.request.outputs.target }}
          SCREEPS_ALLOW_WORLD_PLACEMENT: ${{ steps.request.outputs.target == 'world' }}
          SCREEPS_REQUESTED_SHARD: ${{ steps.request.outputs.shard }}
          SCREEPS_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SCREEPS_COMMAND: ${{ steps.request.outputs.command }}

      - name: Deploy code
        if: >-
          (github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.completed != 'true') &&
          steps.request.outputs.mode == 'deploy-code'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --filter . --filter @screeps/runtime --frozen-lockfile=false
          pnpm check
          pnpm build:runtime
          node scripts/deploy-code.mjs
        env:
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}
          SCREEPS_BRANCH: ${{ vars.SCREEPS_BRANCH }}
          SCREEPS_TARGET: ${{ steps.request.outputs.target }}
          SCREEPS_ALLOW_WORLD_DEPLOYMENT: ${{ steps.request.outputs.target == 'world' }}
          SCREEPS_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SCREEPS_COMMAND: ${{ steps.request.outputs.command }}

      - name: Run PTR experiment
        if: >-
          (github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.completed != 'true') &&
          steps.request.outputs.mode == 'experiment'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --filter . --filter @screeps/runtime --frozen-lockfile=false
          pnpm check
          pnpm build:runtime
          node scripts/deploy-code-ptr.mjs
          node scripts/run-ptr-experiment.mjs
        env:
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}
          SCREEPS_BRANCH: ${{ vars.SCREEPS_BRANCH }}
          SCREEPS_SHARD: ${{ vars.SCREEPS_SHARD }}
          SCREEPS_REQUESTED_SHARD: ${{ steps.request.outputs.shard }}
          SCREEPS_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SCREEPS_COMMAND: ${{ steps.request.outputs.command }}
          SCREEPS_EXPERIMENT: ${{ steps.request.outputs.experiment }}
          SCREEPS_EXPERIMENT_SAMPLES: 12
          SCREEPS_EXPERIMENT_INTERVAL_MS: 5000

      - name: Run headless scenario
        if: >-
          (github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.completed != 'true') &&
          steps.request.outputs.mode == 'scenario'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --filter . --filter @screeps/runtime --frozen-lockfile=false
          pnpm check
          pnpm scenario:headless
        env:
          SCREEPS_REQUEST_ID: ${{ steps.request.outputs.request_id }}
          SCREEPS_COMMAND: ${{ steps.request.outputs.command }}
          SCREEPS_SCENARIO: ${{ steps.request.outputs.scenario }}

      - name: Upload Screeps insights
        if: github.event_name == 'workflow_dispatch' || steps.dedupe.outputs.completed != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.request.outputs.artifact_name }}
          path: artifacts/screeps-insights.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Write completion receipt
        if: github.event_name == 'issue_comment' && steps.dedupe.outputs.completed != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ steps.request.outputs.marker }}
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          COMMAND: ${{ steps.request.outputs.command }}
          ARTIFACT: ${{ steps.request.outputs.artifact_name }}
        run: |
          set -euo pipefail
          printf -v BODY '%s\n✅ completed `%s`\nrequest: `%s`\nartifact: `%s`\nrun: %s/%s/actions/runs/%s' \
            "$MARKER" "$COMMAND" "$REQUEST_ID" "$ARTIFACT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/5/comments" -f body="$BODY" >/dev/null
