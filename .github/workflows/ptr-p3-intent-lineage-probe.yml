name: PTR P3 Intent Lineage Probe

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  probe:
    if: >-
      github.event.issue.number == 5 &&
      github.event.comment.body == '/probe-p3-lineage' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Validate Infisical configuration
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
        run: |
          test -n "$INFISICAL_IDENTITY_ID"
          test -n "$INFISICAL_PROJECT_SLUG"
          test -n "$INFISICAL_ENV_SLUG"

      - name: Fetch Screeps token from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /deploy
          recursive: false
          include-imports: false

      - name: Create bounded PTR work and capture current P3 lineage
        run: node scripts/ptr-p3-intent-lineage-probe.mjs
        env:
          SCREEPS_HOST: ${{ vars.SCREEPS_HOST }}

      - name: Upload probe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ptr-p3-intent-lineage-probe-${{ github.event.comment.id }}
          path: artifacts/p3-intent-lineage-probe.json
          if-no-files-found: warn
          retention-days: 7

      - name: Write completion receipt
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf -v BODY '✅ completed `/probe-p3-lineage`\nruntime-under-test: `51f2de7d9905921261ecd8482c123a7b9c57c050`\nartifact: `ptr-p3-intent-lineage-probe-%s`\nrun: %s/%s/actions/runs/%s' \
            '${{ github.event.comment.id }}' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/5/comments" -f body="$BODY" >/dev/null
